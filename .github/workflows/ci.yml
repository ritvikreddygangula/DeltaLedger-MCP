name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  eval:
    runs-on: ubuntu-latest
    needs: test
    # Only on PRs, not on push-to-main -- a push to main is always an
    # already-merged PR's commit that this same job already ran (and
    # billed) minutes earlier during review. Re-running it again on push
    # tests the identical code against the identical golden set for zero
    # new information, at full OpenAI cost, on every single merge.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run eval harness against golden set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest -m eval -v
