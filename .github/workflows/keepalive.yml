name: Keepalive

# Supabase's free tier pauses a project after 7 days without database
# activity, which would quietly break the live demo. /api/health runs a real
# `SELECT 1`, so one daily ping keeps the project active (and wakes the
# Render free instance as a side effect).
#
# Set the repo variable API_BASE_URL (Settings -> Secrets and variables ->
# Actions -> Variables) to the Render URL, e.g.
# https://materiality-engine-api.onrender.com. The job is a no-op until then.

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.API_BASE_URL != ''
    steps:
      - name: Ping health check
        # Render's free tier can take ~1 min to wake, hence the generous timeout and retries.
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_BASE_URL }}/api/health"
