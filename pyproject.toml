[project]
name = "materiality-engine"
version = "0.1.0"
description = "Filing materiality & diligence agent: detects and classifies material changes across sequential SEC filings"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "openai>=3.8.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
