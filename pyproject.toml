[project]
name = "materiality-engine"
version = "0.1.0"
description = "Filing materiality & diligence agent: detects and classifies material changes across sequential SEC filings"
requires-python = ">=3.12"
# Only what the deployed API (src/api/*) actually imports. Everything the
# offline ingestion pipeline needs lives in the "pipeline" dependency group
# below -- kept separate so the Lambda's requirements.txt (via `uv export
# --no-group pipeline`) doesn't drag in scipy/scikit-learn/numpy/openai/
# tiktoken/langgraph, which are unused dead weight there and were pushing a
# plain zip deployment package right up against Lambda's 250MB limit.
dependencies = [
    "fastapi>=0.141.1",
    "mangum>=0.22.0",
    "mcp>=2.2.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
pipeline = [
    "beautifulsoup4>=4.15.0",
    "langgraph>=1.2.11",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "eval: real OpenAI calls against the golden set, excluded from the default run",
]
addopts = "-m 'not eval'"
